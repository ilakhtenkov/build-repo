name: Test Conditions

on:
  push: {}

jobs:
  prepare-deploy:
    runs-on: ubuntu-latest
    outputs:
      deploy1_json: ${{ steps.prepare-deploy.outputs.deploy1_json }}
      deploy2_json: ${{ steps.prepare-deploy.outputs.deploy2_json }}
    steps:
    - name: Dump GitHub context
      env:
        GITHUB_CONTEXT: ${{ toJson(github) }}
      run: |
        echo ${GITHUB_CONTEXT} | jq .
    - name: Dump env vars
      run: env
    - name: ''
      id: prepare-deploy
      run: |
        echo deploy1_json='{"applications": []}' > $GITHUB_OUTPUT
        echo deploy2_json='{"applications": [{"name": "app1", "image": "nginx:latest"}]}' > $GITHUB_OUTPUT
  deploy1:
    runs-on: ubuntu-latest
    needs:
      - prepare-deploy
    if: |
      always()
      && fromJSON(needs.prepare-deploy.outputs.deploy1_json)['applications'] != '[]'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    outputs:
      deploy_json: ${{ steps.prepare-deploy.outputs.deploy_json }}
    steps:
    - name: Show deployment json
      run: |
        echo applications_array=${{ fromJSON(needs.prepare-deploy.outputs.deploy1_json)['applications'] }}
  deploy2:
    runs-on: ubuntu-latest
    needs:
      - prepare-deploy
    if: |
      always()
      && fromJSON(needs.prepare-deploy.outputs.deploy2_json)['applications'] != '[]'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    outputs:
      deploy_json: ${{ steps.prepare-deploy.outputs.deploy_json }}
    steps:
    - name: Show deployment json
      run: |
        echo applications_array=${{ fromJSON(needs.prepare-deploy.outputs.deploy2_json)['applications'] }}
        
